# Copy this file to .streamlit/secrets.toml and fill in real values.
# .streamlit/secrets.toml is gitignored and must never be committed.

# Path to the judge credentials JSON file (see credentials/judge_credentials.example.json
# for the expected schema), relative to the app directory unless absolute.
# If unset, the app falls back to $JUDGE_CREDENTIALS_PATH, then to "credentials/juizes.json".
credentials_path = "credentials/juizes.json"

# Google Sheets connections (via st-gsheets-connection), one per case type. Each block is a
# standard Google Cloud service-account key: create one in Google Cloud Console (IAM & Admin >
# Service Accounts), share the target spreadsheet with its client_email, then paste the key
# fields below.
[connections.gsheets_dv]
type = "service_account"
spreadsheet = "https://docs.google.com/spreadsheets/d/REPLACE_WITH_DV_SPREADSHEET_ID"
project_id = "REPLACE_WITH_PROJECT_ID"
private_key_id = "REPLACE_WITH_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
client_email = "REPLACE_WITH_SERVICE_ACCOUNT_EMAIL"
client_id = "REPLACE_WITH_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
universe_domain = "googleapis.com"

[connections.gsheets_ic]
type = "service_account"
spreadsheet = "https://docs.google.com/spreadsheets/d/REPLACE_WITH_IC_SPREADSHEET_ID"
project_id = "REPLACE_WITH_PROJECT_ID"
private_key_id = "REPLACE_WITH_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
client_email = "REPLACE_WITH_SERVICE_ACCOUNT_EMAIL"
client_id = "REPLACE_WITH_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
universe_domain = "googleapis.com"
